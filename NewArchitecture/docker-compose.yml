services:

  # ── Databases ────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: novastack-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: novastack_products
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novastack-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: novastack-sqlserver
    environment:
      SA_PASSWORD: "NovaStack@2024!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'NovaStack@2024!' -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - novastack-network

  mongo:
    image: mongo:8
    container_name: novastack-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: myuser
      MONGO_INITDB_ROOT_PASSWORD: mypassword
      MONGO_INITDB_DATABASE: novastack_products
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novastack-network

  # ── Message Brokers ──────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: novastack-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - novastack-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: novastack-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - novastack-network

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: novastack-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
      - "29092:29092"   # External access
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - novastack-network

  # ── Caching ──────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: novastack-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - novastack-network

  # ── Services ─────────────────────────────────────────────────────────────────

  product-api:
    build:
      context: .
      dockerfile: src/Services/Product.Api/Dockerfile
    container_name: novastack-product-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Database__Provider=PostgreSQL
      - Database__ConnectionString=Host=postgres;Port=5432;Database=novastack_products;Username=postgres;Password=postgres
      - Database__AutoMigrate=true
      - Messaging__Provider=RabbitMQ
      - Messaging__RabbitMQ__Host=rabbitmq
      - Cache__Provider=Redis
      - Cache__RedisConnectionString=redis:6379
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - novastack-network

  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity.Api/Dockerfile
    container_name: novastack-identity-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Database__Provider=PostgreSQL
      - Database__ConnectionString=Host=postgres;Port=5432;Database=novastack_identity;Username=postgres;Password=postgres
      - Database__AutoMigrate=true
      - Jwt__Issuer=NovaStack
      - Jwt__Audience=NovaStack.Clients
      - Jwt__SecretKey=CHANGE_ME_super_secret_key_at_least_32_chars!
      - Jwt__ExpiryMinutes=60
      - Jwt__RefreshTokenExpiryDays=7
      - Cache__Provider=Redis
      - Cache__RedisConnectionString=redis:6379
    ports:
      - "5010:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - novastack-network

  product-consumer:
    build:
      context: .
      dockerfile: src/Workers/Product.Consumer/Dockerfile
    container_name: novastack-product-consumer
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Messaging__Provider=RabbitMQ
      - Messaging__RabbitMQ__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - novastack-network

  notification-consumer:
    build:
      context: .
      dockerfile: src/Workers/Notification.Consumer/Dockerfile
    container_name: novastack-notification-consumer
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Messaging__Provider=RabbitMQ
      - Messaging__RabbitMQ__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - novastack-network

# ── Volumes ───────────────────────────────────────────────────────────────────

volumes:
  postgres_data:
  sqlserver_data:
  mongo_data:
  rabbitmq_data:
  redis_data:

# ── Networks ──────────────────────────────────────────────────────────────────

networks:
  novastack-network:
    driver: bridge
